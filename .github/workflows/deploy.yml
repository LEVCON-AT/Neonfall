# ═══════════════════════════════════════════════════════════════
#  NEONFALL — GITHUB ACTIONS DEPLOYMENT WORKFLOW
# ═══════════════════════════════════════════════════════════════
#
#  Trigger: Jeder Push auf `main` → automatisches Deployment auf VPS
#  Manueller Trigger: GitHub UI → Actions → "Deploy to VPS" → Run workflow
#
#  Voraussetzungen (siehe deploy/DEPLOYMENT.md):
#  1. Einmaliges Initial-Setup via deploy/scripts/deploy.sh auf VPS
#  2. GitHub Secrets konfiguriert:
#     - VPS_HOST (z.B. 87.106.25.91)
#     - VPS_USER (z.B. root oder deploy-User)
#     - VPS_SSH_KEY (private SSH-Key)
#     - VPS_PORT (optional, default 22)

name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug output'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Verhindert parallele Deploys
concurrency:
  group: deploy-vps-neonfall
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════════════
  #  QUALITY GATES — müssen alle grün sein bevor deploy läuft
  # ═══════════════════════════════════════════════════════════════
  quality:
    name: Lint + Build + Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (ESLint)
        run: bun run lint

      - name: Build (Next.js standalone)
        run: bun run build
        env:
          DATABASE_URL: "file:/tmp/test.db"

      - name: Dependency Audit (critical only)
        run: |
          OUTPUT=$(bun audit --prod 2>&1 || true)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "critical:"; then
            echo "❌ Critical vulnerabilities found!"
            exit 1
          fi
          echo "✅ No critical vulnerabilities"

      - name: Secrets Scan
        run: |
          if grep -rE "(ghp_[a-zA-Z0-9]{36}|sk-[a-zA-Z0-9]{48}|AKIA[A-Z0-9]{16})" src/ public/ deploy/ --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" --include="*.md" 2>/dev/null; then
            echo "❌ Potential secrets found!"
            exit 1
          fi
          echo "✅ No secrets detected"

  # ═══════════════════════════════════════════════════════════════
  #  DEPLOY — läuft nur wenn quality grün ist
  # ═══════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify secrets are set
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          echo "Checking required GitHub Secrets..."
          
          if [ -z "$VPS_HOST" ]; then
            echo "❌ ERROR: VPS_HOST secret is not set"
            echo "   Go to: https://github.com/LEVCON-AT/Neonfall/settings/secrets/actions"
            echo "   Add: VPS_HOST = your VPS IP (e.g. 87.106.25.91)"
            exit 1
          fi
          
          if [ -z "$VPS_USER" ]; then
            echo "❌ ERROR: VPS_USER secret is not set"
            echo "   Add: VPS_USER = root (or your deploy user)"
            exit 1
          fi
          
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "❌ ERROR: VPS_SSH_KEY secret is not set"
            echo "   Add: VPS_SSH_KEY = your private SSH key (full content)"
            exit 1
          fi
          
          echo "✅ All required secrets are set"
          echo "   VPS_HOST: $VPS_HOST"
          echo "   VPS_USER: $VPS_USER"
          echo "   VPS_PORT: ${VPS_PORT:-22}"

      - name: Setup SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          PORT="${VPS_PORT:-22}"
          echo "Using VPS_HOST=$VPS_HOST PORT=$PORT"
          
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Write private key
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Verify key was written
          if [ ! -s ~/.ssh/deploy_key ]; then
            echo "ERROR: VPS_SSH_KEY secret is empty or not set"
            exit 1
          fi
          
          # Key scan (more robust with timeout)
          echo "Scanning VPS host key on port $PORT..."
          ssh-keyscan -p "$PORT" -T 30 "$VPS_HOST" >> ~/.ssh/known_hosts 2>&1 || {
            echo "ERROR: ssh-keyscan failed for $VPS_HOST:$PORT"
            echo "   Check: Is the VPS reachable? Is the port correct?"
            exit 1
          }
          
          # Test SSH connection
          echo "Testing SSH connection..."
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@$VPS_HOST" "echo SSH_OK" || {
            echo "ERROR: SSH connection failed"
            echo "   Check: Is VPS_USER correct? Is the SSH key authorized on the VPS?"
            echo "   The public key must be in ~/.ssh/authorized_keys on the VPS"
            exit 1
          }
          echo "✓ SSH setup complete"

      - name: Copy update script to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          PORT="${VPS_PORT:-22}"
          scp -i ~/.ssh/deploy_key -P "$PORT" -o StrictHostKeyChecking=yes \
            deploy/scripts/vps-update.sh \
            "$VPS_USER@$VPS_HOST:/tmp/neonfall-vps-update.sh"

      - name: Execute update script on VPS
        uses: appleboy/ssh-action@v1
        env:
          PORT: ${{ secrets.VPS_PORT }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: PORT
          script: |
            chmod +x /tmp/neonfall-vps-update.sh
            bash /tmp/neonfall-vps-update.sh

      - name: Health Check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            sleep 5
            echo "=== Service Status ==="
            systemctl is-active neonfall || echo "neonfall service not found"
            echo "=== DB File ==="
            ls -la /var/www/neonfall/db/ 2>&1 || echo "DB dir not found"
            echo "=== Test local ==="
            curl -sI http://127.0.0.1:3003/ 2>/dev/null | head -3 || echo "Port 3003 not responding"
            echo "=== Test external ==="
            curl -sI https://neonfall.levcon.ai/ 2>/dev/null | head -3 || echo "External URL not responding yet"
            # Don't fail the build if external URL doesn't respond — DNS/SSL might still be propagating
            if curl -sf https://neonfall.levcon.ai/ -o /dev/null 2>/dev/null; then
              echo "✅ Health check passed — site is up"
            else
              echo "⚠ External URL not yet reachable (DNS/SSL propagation?)"
              echo "  Check: dig neonfall.levcon.ai +short"
              echo "  Check: certbot certificates"
            fi

      - name: Cleanup
        if: always()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            rm -f /tmp/neonfall-vps-update.sh

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo ""
          echo "Common causes:"
          echo "  1. GitHub Secrets not set (VPS_HOST, VPS_USER, VPS_SSH_KEY)"
          echo "  2. SSH key not authorized on VPS (~/.ssh/authorized_keys)"
          echo "  3. VPS not reachable (firewall, wrong IP/port)"
          echo "  4. deploy.sh not yet run on VPS (initial setup missing)"
          echo "  5. Git clone on VPS fails (SSH key for GitHub not configured)"
          echo ""
          echo "Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1
