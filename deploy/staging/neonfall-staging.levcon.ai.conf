# ═══════════════════════════════════════════════════════════════
#  NEONFALL STAGING — NGINX CONFIG (Next.js + SSL)
#  Pfad auf VPS: /etc/nginx/sites-available/neonfall-staging.levcon.ai
# ═══════════════════════════════════════════════════════════════
#
#  Identisch zur Production config, aber:
#  - server_name: neonfall-staging.levcon.ai
#  - Upstream: Port 3005 (Staging Next.js)
#  - Multiplayer: Port 3006 (Staging socket.io)
#  - SSL: neonfall-staging.levcon.ai cert

limit_req_zone $binary_remote_addr zone=neonfall_staging_api:10m rate=10r/s;

upstream neonfall_staging_nextjs {
    server 127.0.0.1:3005;
    keepalive 32;
}

map $arg_XTransformPort $neonfall_staging_upstream {
    default neonfall_staging_nextjs;
    ""      neonfall_staging_nextjs;
    ~^\d+$  127.0.0.1:$arg_XTransformPort;
}

map $http_upgrade $neonfall_staging_connection {
    default upgrade;
    ""      "";
}

# HTTP → HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name neonfall-staging.levcon.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Main Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name neonfall-staging.levcon.ai;

    # ── SSL ────────────────────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/neonfall-staging.levcon.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neonfall-staging.levcon.ai/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/neonfall-staging.levcon.ai/chain.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:NEONFALL_STAGING_SSL:50m;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ── Security Headers ───────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: ws:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # ── Logs ───────────────────────────────────────────────────
    access_log /var/log/nginx/neonfall-staging.levcon.ai.access.log;
    error_log /var/log/nginx/neonfall-staging.levcon.ai.error.log warn;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location /_next/static/ {
        proxy_pass http://neonfall_staging_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /_next/image {
        proxy_pass http://neonfall_staging_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location ~* \.(svg|ico|png|jpg|jpeg|gif|webp|woff|woff2|ttf|eot|txt|xml|webmanifest)$ {
        proxy_pass http://neonfall_staging_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 7d;
    }

    location /api/ {
        limit_req zone=neonfall_staging_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://neonfall_staging_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ── Main Reverse Proxy + WebSocket ──
    location / {
        proxy_pass http://$neonfall_staging_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $neonfall_staging_connection;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml font/woff2;

    client_max_body_size 10m;
}
